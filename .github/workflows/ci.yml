# CI — main 푸시마다 전체 검사 → 이미지 → (NAS 실행기가 있으면) 배포
# docs/adr/2026-10-28-dev-workflow.md, docs/adr/2026-10-28-deploy-and-ops.md
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PR은 새 푸시가 오면 이전 실행을 취소한다. main은 취소하지 않는다(배포 도중에 끊기지 않게).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24.22.1"
  PNPM_VERSION: "11.28.9"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
    # DB 통합 테스트용 — 운영과 같은 PostgreSQL 이미지. 이 작업 안에서만 쓰고 버리므로 비밀번호 없이 연다
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: terra
          POSTGRES_DB: terra
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U terra -d terra"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://terra@127.0.0.1:5432/terra
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 배포가 필요한 변경인지 (문서·스킬만 바뀌면 이미지·배포 생략)
        id: changes
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$before" "$GITHUB_SHA" | grep -q -v -E '^(docs/|\.claude/|\.agent/)|\.md$'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "문서·스킬만 바뀌어 이미지 빌드와 배포를 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: 검사 (포맷·린트·타입·경계·파일 크기·다국어·테스트, DB 통합 테스트 포함)
        run: pnpm check
      - name: 표 정의와 마이그레이션 일치 (schema.ts를 바꾸고 db:generate를 빠뜨리면 실패)
        run: |
          pnpm --filter @terra/server db:generate
          if [ -n "$(git status --porcelain -- apps/server/drizzle)" ]; then
            git status --short -- apps/server/drizzle
            echo "::error::apps/server/src/db/schema.ts에 맞는 마이그레이션이 없습니다. pnpm --filter @terra/server db:generate 후 커밋하세요."
            exit 1
          fi
      - name: 작업 기록 목차 최신 여부
        run: pnpm docs:index --check
      - name: 문서 갱신 규칙 (코드 변경 → 작업 기록, 새 런타임 의존성 → ADR)
        run: node scripts/check-docs.mjs "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: 빌드
        run: pnpm build

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (저장소 전체 이력)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git --no-banner --redact -v /repo

  image:
    needs: [check, secrets]
    # main 푸시 또는 main에서 수동 실행(Run workflow)할 때만. 문서·스킬만 바뀐 푸시는 건너뛴다
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - name: GHCR 로그인
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: 이미지 빌드
        run: |
          # source 라벨: GHCR 패키지를 이 저장소에 연결한다(권한 상속)
          docker build --build-arg APP_BUILD="${GITHUB_SHA::12}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE_REF" .
      - name: 이미지 동작 확인 (컨테이너 실행 → /health, 첫 화면)
        run: |
          docker run -d --name smoke -p 127.0.0.1:4100:4100 "$IMAGE_REF"
          ok=""
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4100/health; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then docker logs smoke; exit 1; fi
          curl -fsS http://127.0.0.1:4100/ | grep -q 'id="root"'
          docker rm -f smoke
      - name: 이미지 푸시
        run: docker push "$IMAGE_REF"

  deploy:
    needs: image
    # NAS에 실행기를 설치하고 저장소 변수 NAS_DEPLOY_ENABLED=true를 켜야 동작한다 (ops/nas-setup.md)
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.NAS_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, nas]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-nas
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: GHCR 로그인
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: 배포
        run: bash ops/deploy.sh "${{ needs.image.outputs.tag }}"
