# CI — 코드·설정 검증(check·secrets)은 작업 PC(lefthook pre-commit·pre-push)에서 돌리고,
# GitHub CI는 main 코드 푸시 때 이미지 빌드·푸시(image) → NAS 배포·점검(deploy)만 한다(2026-11-18).
# 문서·스킬만 바뀐 푸시는 이 워크플로가 아예 시작하지 않는다(paths-ignore, 사용량 0).
# docs/adr/2026-10-28-dev-workflow.md, docs/adr/2026-10-28-deploy-and-ops.md, docs/adr/2026-11-18-ci-local-and-nas.md
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".claude/**"
      - ".agent/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# main은 취소하지 않는다(배포 도중에 끊기지 않게).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 배포가 필요한 변경인지 (문서·스킬만 바뀌면 이미지·배포 생략)
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            last_ok="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)"
            if [ -n "$last_ok" ] && git cat-file -e "${last_ok}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$last_ok" "$GITHUB_SHA"; then
              before="$last_ok"
            fi
          fi
          echo "배포 판단 기준 커밋: ${before}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$before" "$GITHUB_SHA" | grep -q -v -E '^(docs/|\.claude/|\.agent/)|\.md$'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "문서·스킬만 바뀌어 이미지 빌드와 배포를 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
          fi
      - id: meta
        if: steps.changes.outputs.deploy == 'true'
        run: |
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - name: GHCR 로그인
        if: steps.changes.outputs.deploy == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: 이미지 빌드 (Dockerfile 안에서 check-pwa·check-bundle·check-content 함께 확인)
        if: steps.changes.outputs.deploy == 'true'
        run: |
          # source 라벨: GHCR 패키지를 이 저장소에 연결한다(권한 상속)
          # APP_BUILD = 커밋 앞 12자(접속 인사·성능 보고가 쓴다), APP_BUILD_NUMBER = 이 워크플로 실행 번호(설정 → 앱 정보에 보이는 차례 번호)
          # APP_BUILD_TIME = 빌드 시각(ISO, UTC). 설정 → 앱 정보의 버전 줄과 /health build가 한국 시각 분까지로 보인다
          docker build --build-arg APP_BUILD="${GITHUB_SHA::12}" \
            --build-arg APP_BUILD_NUMBER="${GITHUB_RUN_NUMBER}" \
            --build-arg APP_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE_REF" .
      - name: 이미지 푸시
        if: steps.changes.outputs.deploy == 'true'
        run: docker push "$IMAGE_REF"

  deploy:
    needs: [image]
    # NAS에 실행기를 설치하고 저장소 변수 NAS_DEPLOY_ENABLED=true를 켜야 동작한다 (ops/nas-setup.md)
    # 컨테이너 실행 점검(/health·정적 파일·PWA·WebSocket, ops/smoke.mjs)은 NAS에서 하며 실패 시 이전 태그로 되돌린다
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.image.outputs.deploy == 'true' && vars.NAS_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, nas]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-nas
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: GHCR 로그인
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: 배포
        run: bash ops/deploy.sh "${{ needs.image.outputs.tag }}"
