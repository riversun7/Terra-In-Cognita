# NAS 사양 수집 — 실행기 설치 후 Actions 탭에서 수동 실행한다 (ops/nas-setup.md)
name: nas-facts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facts:
    runs-on: [self-hosted, nas]
    timeout-minutes: 10
    steps:
      - name: 사양 수집
        run: |
          DATA_DIR=/volume1/docker/terra-in-cognita
          mkdir -p "$DATA_DIR/fsync-test"
          {
            echo "## NAS 사양 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            echo '```'
            echo "kernel: $(uname -r)"
            echo "arch:   $(uname -m)"
            echo "cpu:    $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
            echo "cores:  $(nproc)"
            echo; free -m
            echo; df -h "$DATA_DIR"
            echo; echo "disks (rotational 1=HDD, 0=SSD):"
            for d in /sys/block/*; do
              case "${d##*/}" in loop*|ram*|zram*|dm-*|md*) continue ;; esac
              if [ -r "$d/queue/rotational" ]; then echo "  ${d##*/}: $(cat "$d/queue/rotational")"; fi
            done
            echo; docker version --format 'docker client: {{.Client.Version}} (API {{.Client.APIVersion}}), engine: {{.Server.Version}} (API {{.Server.APIVersion}})' \
              || echo "docker version 실패 (클라이언트·엔진 API 불일치 가능)"
            docker compose version
            echo; echo "containers (이름, 이미지, 상태, 공개 포트):"; docker ps -a --format '{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
            echo '```'
            echo "### 디스크 동기화 지연 (pg_test_fsync, 2초씩)"
            echo '```'
            docker run --rm -v "$DATA_DIR/fsync-test:/test" postgres:18.6-trixie pg_test_fsync -f /test/fsync.tmp -s 2
            echo '```'
            echo "### 데이터 폴더 권한 (앱 컨테이너 node 사용자 = uid 1000)"
            echo '```'
            for d in "$DATA_DIR" "$DATA_DIR/planet-cache" "$DATA_DIR/pgdata" "$DATA_DIR/backups"; do
              stat -c '%n  inode %i  소유 %u:%g  권한 %a (%A)' "$d" 2>&1 || true
            done
            # 시놀로지 공유 폴더 ACL은 확장 속성에 있다(이름만 출력)
            python3 - "$DATA_DIR" "$DATA_DIR/planet-cache" <<'PY' || echo "확장 속성: python3 없음 또는 실패"
          import os, sys
          for path in sys.argv[1:]:
              try:
                  print(path, "확장 속성:", os.listxattr(path, follow_symlinks=False))
              except OSError as error:
                  print(path, "확장 속성 읽기 실패:", error)
          PY
            echo; echo "앱 컨테이너 안:"
            docker exec tic-app sh -c 'id; stat -c "%n  inode %i  소유 %u:%g  권한 %a (%A)" /app/planet-cache; ls -lna /app/planet-cache | head -5' || true
            echo; echo "uid 1000 쓰기 시험(임시 파일을 만들고 바로 지운다):"
            docker run --rm --user 1000:1000 -v "$DATA_DIR/planet-cache:/c" postgres:18.6-trixie \
              sh -c 'touch /c/.write-probe && rm /c/.write-probe && echo "쓰기 가능"' || echo "쓰기 불가"
            # 시놀로지 공유 폴더는 root가 만든 새 폴더도 555로 보인다(2026-10-29 확인). chmod로 바뀌는지 빈 시험 폴더로 본다
            echo; echo "새 폴더 시험(root가 만들고 chown 1000 → chmod 755 → uid 1000 쓰기, 끝나면 지운다):"
            PERM_TEST="$DATA_DIR/perm-test"
            mkdir -p "$PERM_TEST" && chown 1000:1000 "$PERM_TEST"
            stat -c '만든 직후  소유 %u:%g  권한 %a (%A)' "$PERM_TEST"
            chmod 0755 "$PERM_TEST"
            stat -c 'chmod 뒤  소유 %u:%g  권한 %a (%A)' "$PERM_TEST"
            docker run --rm --user 1000:1000 -v "$PERM_TEST:/c" postgres:18.6-trixie \
              sh -c 'touch /c/.write-probe && stat -c "새 파일  소유 %u:%g  권한 %a" /c/.write-probe && rm /c/.write-probe && echo "쓰기 가능"' || echo "쓰기 불가"
            rm -rf "$PERM_TEST"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # 중간에 멈춰도 시험 폴더는 지운다
          rm -rf "$DATA_DIR/fsync-test" "$DATA_DIR/perm-test"
