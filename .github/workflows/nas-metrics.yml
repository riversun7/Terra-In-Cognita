# 운영 지표 보기 — Actions 탭에서 수동 실행한다. 읽기만 한다(컨테이너·DB를 바꾸지 않는다).
# - 서버 지표: 1분마다 로그 한 줄(apps/server/src/metrics.ts, S1 값은 src/world/worldStats.ts). 앱 컨테이너를 다시 만들면 지난 줄은 없어진다.
# - 기기 성능·오류: 기기가 1분마다 보낸 표(client_perf_samples, client_errors). DB에 남는다.
# - 행성 준비: 앱 컨테이너가 시작할 때 남긴 줄(굽기 시간·최대 메모리 또는 캐시 읽기 시간, apps/server/src/planet/service.ts). 시작 뒤 지난 분과 상관없이 보여 준다.
# - 배·부두 지우기: boat_resets 표(행성마다 한 번)와 앱 로그의 "boat reset" 줄. 지난 분과 상관없이 보여 준다.
# 컨테이너 환경 변수에는 비밀값이 있으므로 출력하지 않는다.
name: nas-metrics

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "최근 몇 분을 볼지 (1~1440)"
        required: false
        default: "60"

permissions:
  contents: read

jobs:
  metrics:
    runs-on: [self-hosted, nas]
    timeout-minutes: 5
    steps:
      - name: 지표 수집
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          # 입력은 숫자만 받는다(그래야 SQL·명령에 넣어도 안전하다)
          case "$MINUTES" in ''|*[!0-9]*) echo "minutes는 1~1440 사이 숫자여야 한다" >&2; exit 1 ;; esac
          if [ "$MINUTES" -lt 1 ] || [ "$MINUTES" -gt 1440 ]; then echo "minutes는 1~1440 사이 숫자여야 한다" >&2; exit 1; fi
          sql() { docker exec tic-db psql -U terra -d terra -P pager=off -c "$1"; }
          {
            echo "## 운영 지표 ($(date -u +%Y-%m-%dT%H:%M:%SZ), 최근 ${MINUTES}분)"
            echo '```'
            docker inspect -f 'tic-app 시작: {{.State.StartedAt}}, 이미지: {{.Config.Image}}' tic-app
            echo; docker stats --no-stream --format '{{.Name}}\tCPU {{.CPUPerc}}\t메모리 {{.MemUsage}} ({{.MemPerc}})\t네트워크 {{.NetIO}}' tic-app tic-db
            echo '```'
            echo "### 서버 1분 지표"
            echo '```'
            docker logs --since "${MINUTES}m" tic-app 2>&1 | grep '"metric":"server"' | tail -n 1440
            echo '```'
            # 행성마다 한 줄("metric":"planet", docs/adr/2026-11-11-planet-scope.md). 서버 줄과 따로라 위 구역은 그대로다
            echo "### 행성별 1분 지표 (2차맵·유닛·이동 중·보는 연결)"
            echo '```'
            docker logs --since "${MINUTES}m" tic-app 2>&1 | grep '"metric":"planet"' | tail -n 1440 || true
            echo '```'
            echo "### 행성별 DB 수 (지금)"
            echo '```'
            sql "select planet_id, 'cities' as what, count(*) as n from world_cities group by planet_id union all select c.planet_id, 'humans', count(*) from world_humans h join world_cities c on c.id = h.city_id group by c.planet_id union all select planet_id, 'buildings', count(*) from world_buildings group by planet_id union all select planet_id, 'polluted_cells', count(*) from planet_pollution group by planet_id union all select planet_id, 'active_waves', count(*) from gardener_waves where state in ('marching', 'fighting') group by planet_id order by 1, 2"
            echo '```'
            echo "### 행성 준비 (컨테이너 시작 뒤 전체)"
            echo '```'
            docker logs tic-app 2>&1 | grep '"msg":"planet ' | tail -n 50 || true
            echo '```'
            # 옛 배·부두 지우기(기획 D-547 1499, apps/server/src/boats/purge.ts): 행성마다 한 번 남는 표지·보고와 그때 로그 줄
            echo "### 배·부두 지우기 기록"
            echo '```'
            sql "select planet_id, applied_at_ms, report from boat_resets order by planet_id" || true
            docker logs tic-app 2>&1 | grep 'boat reset' | tail -n 5 || true
            echo '```'
            echo "### 서버 경고·오류 로그 (최근 ${MINUTES}분)"
            echo '```'
            docker logs --since "${MINUTES}m" tic-app 2>&1 | grep -E '"level":(40|50|60)|"level":"(warn|error|fatal)"|^✗|Error:' | tail -n 200 || true
            echo '```'
            echo "### 기기 성능 (1분마다)"
            echo '```'
            sql "select received_at, page, window_sec, fps, frame_p50_ms, frame_p95_ms, frame_max_ms, long_frames, memory_mb, user_agent, device from client_perf_samples where received_at > now() - interval '${MINUTES} minutes' order by id limit 1440"
            echo '```'
            echo "### 기기 오류"
            echo '```'
            sql "select received_at, kind, page, left(message, 300) as message from client_errors where received_at > now() - interval '${MINUTES} minutes' order by id limit 200"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
