<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Terra In-Cognita 아이콘: 다시 푸르러진 지구·정원 새싹(D-063·D-073·새싹 장난감)과 궤도 정거장 고리(D-052·D-070) -->
  <defs>
    <!-- 밤하늘 배경 그라데이션 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142242"/>
      <stop offset="55%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#060a14"/>
    </linearGradient>

    <!-- 행성 대기 광채 -->
    <radialGradient id="atmo" cx="50%" cy="55%" r="44%">
      <stop offset="0%" stop-color="#6ae6ff" stop-opacity="0.42"/>
      <stop offset="62%" stop-color="#339af0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#339af0" stop-opacity="0"/>
    </radialGradient>

    <!-- 바다 입체 그라데이션 -->
    <radialGradient id="ocean" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#88f4ff"/>
      <stop offset="36%" stop-color="#3ec2f7"/>
      <stop offset="76%" stop-color="#1d7fe0"/>
      <stop offset="100%" stop-color="#114b96"/>
    </radialGradient>

    <!-- 대륙 그라데이션 -->
    <linearGradient id="land" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#c2fa9e"/>
      <stop offset="50%" stop-color="#7ce374"/>
      <stop offset="100%" stop-color="#3fb553"/>
    </linearGradient>

    <!-- 새싹 잎 그라데이션 -->
    <linearGradient id="leafL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0ffbf"/>
      <stop offset="55%" stop-color="#8ef078"/>
      <stop offset="100%" stop-color="#45bd50"/>
    </linearGradient>
    <linearGradient id="leafR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ceffa3"/>
      <stop offset="55%" stop-color="#76e368"/>
      <stop offset="100%" stop-color="#36a647"/>
    </linearGradient>

    <!-- 궤도 고리 그라데이션 (위쪽=뒤쪽 그림자, 아래쪽=앞쪽 황금빛) -->
    <linearGradient id="ringGrad" x1="32" y1="25" x2="32" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a88644"/>
      <stop offset="45%" stop-color="#eab957"/>
      <stop offset="78%" stop-color="#ffe07d"/>
      <stop offset="100%" stop-color="#fff4c4"/>
    </linearGradient>

    <!-- 행성 클리핑 -->
    <clipPath id="planetClip">
      <circle cx="32" cy="35.5" r="17"/>
    </clipPath>

    <!-- 궤도 고리 가시 영역: 전체 화면에서 행성 상단 반구(r=17)만 제외 (좌우 끝단 이음매 0) -->
    <clipPath id="ringVisibleClip">
      <path clip-rule="evenodd" d="M-10,-10H74V74H-10ZM15,35.5A17,17 0 0,1 49,35.5Z"/>
    </clipPath>
  </defs>

  <!-- 1. 우주 배경 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#8ecbff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- 배경 별빛 -->
  <path d="M13 13l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1z" fill="#fff4c2" opacity="0.9"/>
  <circle cx="52" cy="14" r="1.3" fill="#9ee6ff" opacity="0.85"/>
  <circle cx="11.5" cy="51.5" r="1.1" fill="#9ee6ff" opacity="0.65"/>
  <circle cx="53" cy="50" r="1.3" fill="#fff4c2" opacity="0.75"/>

  <!-- 2. 행성 대기 광채 -->
  <circle cx="32" cy="35.5" r="24.5" fill="url(#atmo)"/>

  <!-- 3. 행성 본체 (바다 + 대륙 + 고리 그림자 + 구면 음영 + 반사광) -->
  <circle cx="32" cy="35.5" r="17" fill="url(#ocean)"/>
  <g clip-path="url(#planetClip)">
    <!-- 북극 새싹 섬 대륙 -->
    <ellipse cx="32" cy="19.5" rx="6.5" ry="3.2" fill="#8ef078"/>
    <!-- 서북~중앙 푸른 대륙 -->
    <path d="M14 30c3-7 10-10 16-7 4 2 2 6 5 8 4 2 6 6 3 10-3 3-8 2-12 5-4 2-9 2-12-3-2-4-2-9 0-13z" fill="url(#land)"/>
    <!-- 동북부 섬 대륙 -->
    <path d="M39 21c4-1 9 2 10 6 1 3-3 5-6 4-4-1-6-4-6-7 0-2 1-3 2-3z" fill="url(#land)"/>
    <!-- 남동부 대륙 -->
    <path d="M37 43.5c3-3 9-3 12 1 2 4-2 9-7 9-5 0-8-6-5-10z" fill="url(#land)"/>

    <!-- 행성 앞쪽 고리 그림자 -->
    <g transform="rotate(-18 32 35.5)">
      <path d="M5.5 35.5a26.5 8.4 0 0 0 53 0" fill="none" stroke="#07224a" stroke-opacity="0.36" stroke-width="4" transform="translate(0 1.8)"/>
    </g>

    <!-- 구면 밤 그림자 (우하단 초승달 음영) -->
    <path d="M45 21.5a17 17 0 0 1-23 29 18 18 0 0 0 23-29z" fill="#081b3d" opacity="0.32"/>

    <!-- 구면 반사광 (좌상단 매끈한 호) -->
    <path d="M19.5 28.5a13.5 13.5 0 0 1 9.5-8" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity="0.68"/>
    <circle cx="18" cy="32.5" r="1.2" fill="#ffffff" opacity="0.58"/>
  </g>
  <!-- 행성 테두리 림라이트 -->
  <circle cx="32" cy="35.5" r="17" fill="none" stroke="#b8f4ff" stroke-opacity="0.55" stroke-width="1"/>

  <!-- 4. 궤도 고리 (단 하나의 닫힌 타원 + 상단 반구 차폐 클립) -->
  <g transform="rotate(-18 32 35.5)" clip-path="url(#ringVisibleClip)">
    <ellipse cx="32" cy="35.5" rx="26.5" ry="8.4" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>
  </g>

  <!-- 5. 정원의 새싹 (행성 꼭대기에서 피어나는 두 잎, 후보 A '새싹 장난감') -->
  <g>
    <!-- 줄기 -->
    <path d="M32 19.5v-5.5" fill="none" stroke="#5ad65c" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 왼쪽 잎 -->
    <path d="M32 15c-1.2-6-7.8-8.2-12.2-5.8-0.4 5 3.8 9.2 12.2 5.8z" fill="url(#leafL)"/>
    <path d="M29.8 13.8c-2.5-1.8-5.2-2.6-7.6-2.4" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.78"/>
    <!-- 오른쪽 잎 -->
    <path d="M32 15c1.4-5.4 7.2-7 11-4.8 0.4 4.4-3.2 8.2-11 4.8z" fill="url(#leafR)"/>
    <path d="M34 13.8c2-1.4 4.3-2 6.4-1.8" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- 6. 궤도 정거장 (하얗고 매끈한 본체 + 청록빛 코어, D-052·D-070 ③) -->
  <g transform="rotate(-18 32 35.5) translate(47.5 42.2)">
    <!-- 정거장 청록 후광 -->
    <circle cx="0" cy="0" r="6.4" fill="#3ee8ff" opacity="0.3"/>
    <!-- 정거장 본체 링 -->
    <circle cx="0" cy="0" r="4.6" fill="#ffffff" stroke="#102342" stroke-width="1.2"/>
    <!-- 정거장 청록 에너지 코어 -->
    <circle cx="0" cy="0" r="2.2" fill="#18d8ff"/>
    <circle cx="-0.7" cy="-0.7" r="0.8" fill="#ffffff"/>
  </g>
</svg>
