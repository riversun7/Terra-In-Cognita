# Git 훅 — 커밋 단계는 가볍게, 무거운 검사는 푸시 전과 CI에서 (docs/adr/2026-10-28-dev-workflow.md)
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc,css}"
      run: pnpm exec biome format --no-errors-on-unmatched {staged_files}
    secrets:
      run: node scripts/check-secrets.mjs --staged

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    check:
      # pnpm check는 콘텐츠 1·2·4a단계만 본다. check:content(인자 없음)는 4b단계(upstream 팩과 비교)까지 본다
      run: pnpm check && pnpm check:docs && pnpm check:content && pnpm docs:index --check
