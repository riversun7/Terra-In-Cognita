# NAS 배포용 compose — 새 스택 (docs/adr/2026-10-28-deploy-and-ops.md)
# 기존 버전(terra-*)과 겹치지 않게 이름은 tic-*를 쓴다.
# deploy.sh가 TERRA_TAG와 .env(비밀값, NAS에만 있음)를 넘겨 실행한다.
name: tic

services:
  app:
    image: ghcr.io/riversun7/terra-in-cognita:${TERRA_TAG:?TERRA_TAG is required}
    container_name: tic-app
    restart: unless-stopped
    environment:
      PORT: "4100"
      # 콘텐츠 팩은 이미지 안에 있다(CONTENT_DIR=/app/content/core, Dockerfile). 이미지 태그를 되돌리면 팩도 함께 되돌아간다
      # 비밀번호는 NAS의 .env에만 있다(deploy.sh가 첫 배포 때 16진수로 만든다 → 주소에 그대로 넣어도 안전)
      DATABASE_URL: postgres://terra:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/terra
      # 로그인(Better Auth, docs/adr/2026-10-28-auth-and-accounts.md). 비밀값은 deploy.sh가 .env에 만든다(바꾸면 모든 로그인이 풀린다)
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      # 사용자가 접속하는 주소(DSM 역방향 프록시). 같은 출처 검사와 Secure 쿠키의 기준이다
      BETTER_AUTH_URL: https://riversun7.synology.me:4443
      # 새 아이디 가입 허용. 닫으려면 .env에 AUTH_OPEN_SIGNUP=false를 넣고 다시 배포한다
      AUTH_OPEN_SIGNUP: ${AUTH_OPEN_SIGNUP:-true}
      # S1 "유닛 1,000개" 시험(ADR 2026-10-28-s1-second-map): 서버가 시험 2차맵에서 봇 1,000개를 움직인다.
      # 휴대폰으로 실제 NAS에서 재야 해서 운영에서 켠다. 측정이 끝나면 0으로(봇 없음, 2차맵·경로 워커는 그대로).
      # 경로 워커 수는 기본 1(PATH_WORKERS). NAS는 2코어 4스레드라 메인 스레드 + 워커 1로 시작한다(ops/nas-facts.md)
      S1_TEST_BOTS: "1000"
      # 시험 2차맵 줄(봇 규모 시험·시험 자리). 세계 배치(docs/adr/2026-11-07-world-layout.md): 국가 넷의 시작 도시는 행성 위 국가마다
      # 자기 자리(수도 + 붙은 2차맵)에 서고 그 2차맵(기본 11장)을 함께 띄운다. 봇 1,000개는 시험 2차맵 줄에만 나눈다(규모 시험 — 도시
      # 인구는 세계 규칙 npc_seed_population_pm, docs/adr/2026-11-07-play-flow.md "WP-NPC2"). 켤 때 모자란 도시·기본 시설만 더한다(있는 것은 그대로)
      S1_TEST_MAPS: "6"
      # NPC 사회 런타임(docs/adr/2026-11-01-npc-brain-r5.md 7절): NPC 국가 넷의 시작 도시에 처음 인구(주거 × 비율, 한 번)를 세우고 세력·사회
      # 규칙을 실제 시간으로 돌린다(기본 켬, 휴먼은 일터·집을 오가고 도시마다 시장 — WP-NPC2). 끄려면 "0"(봇만 걷는다, 표·행은 그대로)
      NPC_SOCIETY: "1"
      NPC_TEST_NATIONS: "4"
      # 옛 세계 시작 도시 옮기기(docs/adr/2026-11-07-world-layout.md 6절): 시험 2차맵 줄에 모인 고정 국가 시작 도시 가운데 플레이어 것
      # (그 2차맵의 플레이어 유닛·건물·계약·수호신·영토 비콘, 일·이동 중인 사이보그)이 걸리지 않은 도시만 그 국가의 행성 위 자리로 옮긴다(감사 기록
      # world.relayout_city). 쉬는 사이보그는 시작 도시와 함께 새 도시 둘레로 간다. 플레이어 자료는 지우지 않는다. 막힌 도시와 까닭은
      # 서버 기록 "world relayout"에 남는다. "0"이면 계획만 기록한다. 사용자 결정(2026-11-08, 질문 645 "다) 제대로 다시"):
      # NAS 시험 세계는 세계 자료를 지우고(계정은 남김) 새로 시작하므로 옮기기가 필요 없다 → "0"
      WORLD_RELAYOUT: "0"
      # 정원사 웨이브(docs/adr/2026-11-01-gardener-r5b.md): 사용자 결정(2026-11-01 "합치되 웨이브 끔")으로 끈다.
      # 오염은 쌓이지만 도시 웨이브는 오지 않는다. 켜려면 "1"(도시 몫 문제·폐허 복원 D-339를 정한 뒤)
      GARDENER_WAVES: "0"
    volumes:
      # 1차맵 행성 타일 캐시(PLANET_CACHE_DIR=/app/planet-cache, Dockerfile). 다시 켤 때 굽지 않고 읽는다.
      # 지워도 된다(다음 시작 때 다시 굽는다). deploy.sh가 폴더를 만들고 컨테이너 node 사용자(1000)에게 소유자·권한(755)을 준다
      - ${TERRA_DATA_DIR:-/volume1/docker/terra-in-cognita}/planet-cache:/app/planet-cache
    ports:
      # NAS 안에서만 열고, 외부 접속은 DSM 역방향 프록시(HTTPS)가 맡는다
      - "127.0.0.1:4100:4100"
    depends_on:
      db:
        condition: service_healthy
    labels:
      # 기존 watchtower가 이 컨테이너를 자동 갱신하지 않게 한다
      com.centurylinklabs.watchtower.enable: "false"
    mem_limit: 1g
    # CPU 상한(cpus)은 NAS 커널(4.4)이 지원하지 않는다(배포 오류로 확인, ops/nas-facts.md).
    # 대신 상대 우선순위만 둔다: 기본값 1024의 절반 → CPU가 모자랄 때 기존 운영 컨테이너에 양보
    cpu_shares: 512
    networks: [tic]

  db:
    image: postgres:18.6-trixie
    container_name: tic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: terra
      POSTGRES_USER: terra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      # PostgreSQL 18 이미지는 /var/lib/postgresql 아래에 버전별 폴더를 만든다
      - ${TERRA_DATA_DIR:-/volume1/docker/terra-in-cognita}/pgdata:/var/lib/postgresql
    # 외부 포트는 열지 않는다. 관리할 때는 `docker exec -it tic-db psql -U terra terra`
    healthcheck:
      # TCP로 확인: 첫 기동 때의 초기화용 임시 서버(소켓만 받음)를 준비 완료로 착각하지 않게
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U terra -d terra"]
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    mem_limit: 1g
    cpu_shares: 512
    networks: [tic]

networks:
  tic:
    name: tic-net
